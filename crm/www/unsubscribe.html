<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ heading }}</title>
    <meta name="robots" content="noindex" />
    <style nonce="{{ csp_nonce }}">
      /* Deliberately self-contained and font-free. This page is opened from a
         mail client on an unknown network by somebody who is annoyed with us;
         it must render instantly and never depend on an asset bundle. Tokens
         mirror crm_form.html so it still looks like the same company. */
      :root {
        --ink-strong: oklch(0.168 0 0);
        --ink: oklch(0.205 0 0);
        --muted: oklch(0.586 0 0);
        --border: oklch(0.913 0 0);
        --bg: oklch(0.964 0 0);
        --card: oklch(1 0 0);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        max-width: 480px;
        width: 100%;
        padding: 32px;
        text-align: center;
      }
      h1 {
        font-size: 20px;
        line-height: 1.3;
        margin: 0 0 12px;
        color: var(--ink-strong);
        font-weight: 600;
      }
      p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--muted); }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>{{ heading }}</h1>
      <p>{{ message }}</p>
    </main>
  </body>
</html>
