<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Join PARAMA CRM</title>
    <style nonce="{{ csp_nonce }}">
      :root {
        color-scheme: light;
        --ink: #171717;
        --muted: #666;
        --border: #e5e5e5;
        --surface: #fff;
        --page: #f5f5f5;
        --accent: #171717;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--page);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      }
      main {
        width: min(100%, 440px);
        padding: 32px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
        text-align: center;
      }
      h1 { margin: 0 0 10px; font-size: 23px; line-height: 1.3; }
      p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.55; }
      form { margin-top: 24px; }
      button {
        width: 100%;
        min-height: 42px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
      }
      button:hover { opacity: 0.88; }
      button:focus-visible { outline: 3px solid #a3a3a3; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      {% if is_valid %}
        <h1>Accept your invitation</h1>
        <p>Continue to join PARAMA CRM. This invitation can only be used once.</p>
        <form method="post" action="/api/method/crm.api.accept_invitation">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
          <input type="hidden" name="key" value="{{ invitation_key }}" />
          <button type="submit">Accept invitation</button>
        </form>
      {% else %}
        <h1>Invitation unavailable</h1>
        <p>This invitation is invalid, expired, or has already been accepted.</p>
      {% endif %}
    </main>
  </body>
</html>
